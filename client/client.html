<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex API</title>
    <link rel="stylesheet" href="/style.css">

    <script>
        const handleResponse = async (response, method) => {
            const content = document.querySelector('#content');
            content.textContent = '';

            const h1 = document.createElement('h1');
            const p = document.createElement('p');

            switch (response.status) {
                case 200:
                    h1.textContent = 'Success';
                    break;
                case 201:
                    h1.textContent = 'Created';
                    break;
                case 204:
                    h1.textContent = 'Updated';
                    break;
                case 400:
                    h1.textContent = 'Bad Request';
                    break;
                case 404:
                    h1.textContent = 'Not Found'
                    break;
            }

            content.appendChild(h1);

            if (method !== "HEAD" && response.status !== 204) {
                const data = await response.json();

                if (response.status !== 200) p.textContent = data.message;
                else {
                    if (data[0].name) data.forEach((pokemon) => content.appendChild(createPokemonCard(pokemon)));
                    else p.textContent = JSON.stringify(data);
                }
            }

            content.appendChild(p);
        }

        const createPokemonCard = (pokemon) => {
            const isFinalEvolution = pokemon.next_evolution ? false : true;

            // Create all necessary elements
            const cardContent = document.createElement('div');
            const name = document.createElement('h2');
            const id = document.createElement('h3');
            const image = document.createElement('img');
            const dataContent = document.createElement('div');
            const typeHeader = document.createElement('h3');
            const type = document.createElement('ul');
            const weaknessesHeader = document.createElement('h3');
            const weaknesses = document.createElement('ul');
            const dimensions = document.createElement('div');

            // Assign/set up all necessary elements
            name.textContent = pokemon.name;
            id.textContent = 'ID: ' + pokemon.id;
            image.setAttribute('src', pokemon.img);
            dimensions.innerHTML = `<p><b>Height</b>: ${pokemon.height}</p><p><b>Weight</b>: ${pokemon.weight}</p><hr>`;
            dimensions.setAttribute('style', 'display:flex; flex-direction: row; justify-content: space-evenly');
            cardContent.setAttribute('class', `card ${pokemon.type[0].toLowerCase()}`);
            const createListElement = (listElement, parent) => {
                const element = document.createElement('li');
                element.textContent = listElement;
                parent.appendChild(element);
            };
            typeHeader.innerHTML = "Type<hr>";
            weaknessesHeader.innerHTML = "Weaknesses<hr>";
            pokemon.type.forEach((t) => createListElement(t, type))
            pokemon.weaknesses.forEach((w) => createListElement(w, weaknesses))

            // Append elements in proper order
            cardContent.append(name, id, image, dataContent);
            dataContent.append(dimensions, typeHeader, type, weaknessesHeader, weaknesses);

            // If the pokemon has future evolutions, include them in card
            if (!isFinalEvolution) {
                const nextEvolutionHeader = document.createElement('h3');
                const nextEvolutions = document.createElement('ul');
                nextEvolutionHeader.innerHTML = '<h3>Next Evolutions<h3><hr>';
                pokemon.next_evolution.forEach((ne) => createListElement(`Name: ${ne.name}. Num: ${ne.num}`, nextEvolutions))
                dataContent.append(nextEvolutionHeader, nextEvolutions);
            }

            return cardContent;
        }

        const apiRequest = async (form) => {
            const url = new URL(form.action);
            const formData = new FormData(form);
            const method = (formData.get('method') || form.method).toUpperCase();

            const options = {
                method,
                headers: {
                    'Accept': 'application/json',
                }
            };

            if (method === "GET" || method === "HEAD") {
                // Set serachParams manually to account for params with multiple values
                formData.forEach((value, key) => {
                    url.searchParams.append(key, value);
                })
            } else if (method.toUpperCase() === "POST") {
                const body = {
                    name: formData.get('name'),
                    id: parseInt(formData.get('id')) || undefined,
                    height: formData.get('height'),
                    weight: formData.get('weight'),
                    img: formData.get('img'),
                    type: formData.getAll('type'),
                    weaknesses: formData.getAll('weaknesses'),
                };

                options.headers['Content-Type'] = 'application/json';
                options.body = JSON.stringify(body);
            }

            const response = await fetch(url, options);
            handleResponse(response, method);
        }

        const getPokemon = async (form) => {
            const response = await apiRequest(form);
            return response;
        };

        const init = () => {
            const getPokemonForm = document.querySelector('#pokemonForm');
            const getPokemonNamesForm = document.querySelector('#pokemonNamesForm');
            const getAllPokemonForm = document.querySelector('#allPokemonForm');
            const getPokemonTypeForm = document.querySelector('#pokemonTypeForm');
            const addPokemonForm = document.querySelector('#addPokemonForm');
            const removePokemonForm = document.querySelector('#removePokemonForm');

            const getPokemonList = (e) => {
                e.preventDefault();
                getPokemon(getPokemonForm);
                return false;
            }

            const getPokemonNameList = (e) => {
                e.preventDefault();
                getPokemon(getPokemonNamesForm);
                return false;
            }

            const getAllPokemon = (e) => {
                e.preventDefault();
                getPokemon(getAllPokemonForm)
                return false;
            }

            const getPokemonTypes = (e) => {
                e.preventDefault();
                fetch(getPokemon(getPokemonTypeForm)).then(response => response.JSON).then(handleResponse(response));
                return false;
            }

            const addPokemon = (e) => {
                e.preventDefault();
                apiRequest(addPokemonForm);
                return false;
            }

            const removePokemon = (e) => {
                e.preventDefault();
                apiRequest(removePokemonForm);
                return false;
            }

            // Populate checkboxes with types
            const types = document.querySelectorAll('.types')
            const weaknesses = document.querySelectorAll('.weaknesses');

            const populateCheckboxes = async (content, type, data) => {
                for (let i = 0; i < data.length; i++) {
                    const lb = document.createElement('label');
                    lb.innerHTML = `<input type='checkbox' name='${type}' value='${data[i]}'>${data[i]}`;

                    content.appendChild(lb);
                }
            };

            const pokemonTypes = fetch('/getPokemonTypes')
                .then(response => response.json())
                .then(data => {
                    types.forEach(type => populateCheckboxes(type, 'type', data));
                    weaknesses.forEach(weakness => populateCheckboxes(weakness, 'weaknesses', data));
                });


            // Add submit forms to relevant methods
            getPokemonForm.addEventListener('submit', getPokemonList);
            getPokemonNamesForm.addEventListener('submit', getPokemonNameList);
            getAllPokemonForm.addEventListener('submit', getAllPokemon);
            getPokemonTypeForm.addEventListener('submit', getPokemonTypes);
            addPokemonForm.addEventListener('submit', addPokemon);
            removePokemonForm.addEventListener('submit', removePokemon);

            //
            const collapsible = document.querySelectorAll('.collapsible');
            const content = document.querySelectorAll('.content');

            for (let i = 0; i < collapsible.length; i++) {
                collapsible[i].addEventListener('click', () => {
                    if (i < content.length) {
                        for (let j = 0; j < content.length; j++) {
                            content[j].style.display = "none";
                            collapsible[j].style.backgroundColor = '#f0f0f0';
                        }

                        content[i].style.display = "block";
                        collapsible[i].style.backgroundColor = "#d0d0d0";
                    }
                })
            }

            // Open first collapsible content box on default
            content[0].style.display = "block";
            collapsible[0].style.backgroundColor = "#d0d0d0"
        };

        window.onload = init;
    </script>
</head>

<body>
    <section id="top">
        <section id="selector">
            <div class="collapsible">
                <h3>/getPokemon</h3>
            </div>
            <div class="collapsible">
                <h3>/getPokemonNames</h3>
            </div>
            <div class="collapsible">
                <h3>/getAllPokemon</h3>
            </div>
            <div class="collapsible">
                <h3>/getPokemonTypes</h3>
            </div>
            <div class="collapsible">
                <h3>/addPokemon</h3>
            </div>
            <div class="collapsible">
                <h3>/removePokemon</h3>
            </div>
        </section>

        <div class="content">
            <div class="content-box">
                <form id='pokemonForm' action="/getPokemon" method="GET">
                    <label>Name: <input class="name" name="name" type="text" /></label>
                    <label>ID: <input class="id" name="id" type="number" min="0" /></label>
                    <fieldset>
                        <legend>Filter Types</legend>
                        <div class="types"></div>
                    </fieldset>
                    <fieldset>
                        <legend>Filter Weaknesses</legend>
                        <div class="weaknesses"></div>
                    </fieldset>
                    <label><input type="radio" name="method" value="GET" checked>GET</label>
                    <label><input type="radio" name="method" value="HEAD">HEAD</label>
                    <button type="submit">Search Pokedex</button>
                </form>

            </div>
        </div>

        <div class="content">
            <div class="content-box">
                <form id='pokemonNamesForm' action="/getPokemonNames" method="GET">
                    <label>Name: <input class="name" name="name" type="text" /></label>
                    <label>ID: <input class="id" name="id" type="number" min="0" /></label>
                    <fieldset>
                        <legend>Filter Types</legend>
                        <div class="types"></div>
                    </fieldset>
                    <fieldset>
                        <legend>Filter Weaknesses</legend>
                        <div class="weaknesses"></div>
                    </fieldset>
                    <label><input type="radio" name="method" value="GET" checked>GET</label>
                    <label><input type="radio" name="method" value="HEAD">HEAD</label>
                    <button type="submit">Search Pokedex</button>
                </form>
            </div>
        </div>


        <div class="content">
            <div class="content-box">
                <form id='allPokemonForm' action="/getAllPokemon" method="GET">
                    <label><input type="radio" name="method" value="GET" checked>GET</label>
                    <label><input type="radio" name="method" value="HEAD">HEAD</label>
                    <button type="submit">Search Pokedex</button>
                </form>
            </div>
        </div>


        <div class="content">
            <div class="content-box">
                <form id='pokemonTypeForm' action="/getPokemonTypes" method="GET">
                    <label><input type="radio" name="method" value="GET" checked>GET</label>
                    <label><input type="radio" name="method" value="HEAD">HEAD</label>
                    <button type="submit">Search Pokedex</button>
                </form>
            </div>
        </div>


        <div class="content">
            <div class="content-box">
                <form id='addPokemonForm' action="/addPokemon" method="post">
                    <label>Name: <input type="text" name="name"></label>
                    <label>Height: <input type="number" step="any" name="height"></label>
                    <label>Weight: <input type="number" step="any" name="weight"></label>
                    <label>Image Link: <input type="text" name="img"></label>
                    <fieldset>
                        <legend>Filter Types</legend>
                        <div class="types"></div>
                    </fieldset>
                    <fieldset>
                        <legend>Filter Weaknesses</legend>
                        <div class="weaknesses"></div>
                    </fieldset>
                    <button type="submit">Add Pokemon to Pokedex</button>
                </form>
            </div>
        </div>


        <div class="content">
            <div class="content-box">
                <form id='removePokemonForm' action="/removePokemon" method="post">
                    <label>Name: <input type="text" name="name"></label>
                    <label>ID: <input type="number" name="id"></label>
                    <button type="submit">Remove Pokemon from Pokedex</button>
                </form>
            </div>
        </div>
    </section>
    <hr>
    <section id="content"></section>

    <section id="bottom">
        <hr>
        <a href="/documentation">
            <h3>View Documentation Here!</h3>
        </a>
    </section>
</body>

</html>
